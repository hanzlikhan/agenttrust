# AgentTrust CI — backend (ruff + pytest on real Postgres) and frontend
# (lint + typecheck + build). NOTE: this has been YAML-validated only; a full
# `act` run was NOT performed in this pass.
name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agenttrust
          POSTGRES_PASSWORD: agenttrust
          POSTGRES_DB: agenttrust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agenttrust"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Ruff check
        run: ruff check src tests
      - name: Pytest
        env:
          # tests/conftest.py honors DATABASE_URL_TEST and runs alembic
          # migrations against it automatically.
          DATABASE_URL_TEST: postgresql+psycopg://agenttrust:agenttrust@localhost:5432/agenttrust_test
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
