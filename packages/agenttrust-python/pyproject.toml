[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agenttrust"
version = "0.1.0"
description = "Python SDK for the AgentTrust pre-execution authorization platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agenttrust"]

[tool.ruff]
line-length = 100
target-version = "py310"
